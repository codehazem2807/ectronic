<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غير متصل | إلكترونك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Cairo', sans-serif;
        background: #f6f8fb;
        color: #0a1f33;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
    }
    .container {
        max-width: 480px;
        background: white;
        padding: 3rem 2rem;
        border-radius: 24px;
        box-shadow: 0 12px 32px rgba(10, 31, 51, 0.12);
    }
    .icon {
        width: 100px;
        height: 100px;
        margin: 0 auto 1.5rem;
        background: linear-gradient(135deg, #1d5b8e, #154668);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 3rem;
    }
    h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 0.75rem;
        color: #0a1f33;
    }
    p {
        color: #475569;
        margin-bottom: 2rem;
        line-height: 1.6;
    }
    button {
        padding: 0.85rem 2rem;
        background: linear-gradient(135deg, #1d5b8e, #154668);
        color: white;
        border: none;
        border-radius: 12px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }
    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(29, 91, 142, 0.4);
    }
</style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <i class="fas fa-wifi"></i>
        </div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>يبدو أنك غير متصل حالياً. تأكد من اتصالك بالشبكة ثم حاول مرة أخرى.</p>
        <button onclick="window.location.reload()">
            <i class="fas fa-rotate-right"></i>
            إعادة المحاولة
        </button>
    </div>
</body>
</html>
